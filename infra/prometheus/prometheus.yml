global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: sfmc-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:3000
          - auth-service:3000
          - user-service:3000
          - product-service:3000
          - inventory-service:3000
          - order-service:3000
          - production-service:3000
          - billing-service:3000
          - notification-service:3000
          - reporting-service:3000
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: instance_name
        replacement: '$1'
