global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: sfmc-services
    metrics_path: /metrics
    # Découverte DNS : chaque réplique d'un service est scrapée séparément (docker compose up --scale)
    dns_sd_configs:
      - names:
          - api-gateway
          - auth-service
          - user-service
          - product-service
          - inventory-service
          - order-service
          - production-service
          - billing-service
          - notification-service
          - reporting-service
        type: A
        port: 3000
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: instance_name
